[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-import-agent"
version = "0.1.0"
description = "ELT import agent driven by a ledger state machine (deterministic fast path + agent slow path)."
license = {text = "MIT"}
authors = [
    {name = "Data Import Agent Contributors"}
]
readme = "README.md"
keywords = ["mcp", "elt", "data-import", "sql-server", "state-machine", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pyodbc>=5",
    "lxml>=5",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-dotenv>=1.0",          # parses database.env
    "mcp>=2",                      # importer mcp server (design §8.19)
    "azure-storage-blob>=12.19",   # Blob locators (design §8.21), imported lazily
    "azure-identity>=1.15",        # Entra credential for Blob, imported lazily
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "xlwt>=1.3",
    "anyio>=4",
]

[project.scripts]
importer = "importer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m \"not integration\""
markers = ["integration: needs the DEV SQL Server (database.env 'importer' entry)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
importer = ["mcp_reference.md"]
